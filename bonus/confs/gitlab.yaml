apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-config
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-logs
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:18.11.1-ce.0
          ports:
            - containerPort: 80
            - containerPort: 443
            - containerPort: 22
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                  external_url 'http://gitlab.example.com'
                  puma['worker_processes'] = 0
                  sidekiq['concurrency'] = 10
                  gitlab_rails['env'] = {
                    'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000'
                  }
                  gitaly['configuration'] = {
                    concurrency: [
                      {
                        'rpc' => "/gitaly.SmartHTTPService/PostReceivePack",
                        'max_per_repo' => 3,
                      }, {
                        'rpc' => "/gitaly.SSHService/SSHUploadPack",
                        'max_per_repo' => 3,
                      },
                    ]
                  }
                  gitaly['env'] = {
                    'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000',
                    'GITALY_COMMAND_SPAWN_MAX_PARALLEL' => '2'
                  }
                  alertmanager['enable'] = false
                  gitlab_exporter['enable'] = false
                  gitlab_kas['enable'] = false
                  node_exporter['enable'] = false
                  postgres_exporter['enable'] = false
                  prometheus_monitoring['enable'] = false
                  prometheus['enable'] = false
                  puma['exporter_enabled'] = false
                  redis_exporter['enable'] = false
                  sidekiq['metrics_enabled'] = false
          volumeMounts:
            - name: config
              mountPath: /etc/gitlab
            - name: logs
              mountPath: /var/log/gitlab
            - name: data
              mountPath: /var/opt/gitlab
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: gitlab-config
        - name: logs
          persistentVolumeClaim:
            claimName: gitlab-logs
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  selector:
    app: gitlab
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
    - name: ssh
      port: 22
      targetPort: 22
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab
  namespace: gitlab
spec:
  rules:
    - host: gitlab.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitlab
                port:
                  number: 80
